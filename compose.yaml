name: api-assets

services:
  calendar:
    image: api-assets/calendar:${CALENDAR_VERSION:-1.0.0-rc.2}
    build:
      context: .
      dockerfile: apis/calendar/runtime/java/calendar-service/Dockerfile
      args:
        VERSION: ${CALENDAR_VERSION:-1.0.0-rc.2}
        SOURCE_COMMIT: ${SOURCE_COMMIT:-local}
    ports:
      - "8080:8080"
    environment:
      UPSTREAM_TOKEN: ${UPSTREAM_TOKEN:-}
      JAVA_OPTS: -Xms256m -Xmx4g -XX:+UseG1GC -Djava.io.tmpdir=/tmp
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 4g
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /internal/health/ready HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200\" <&3'"]
      interval: 10s
      timeout: 3s
      retries: 6
