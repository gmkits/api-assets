server:
  port: 18080
  tomcat:
    # 虚拟线程由 VirtualThreadConfiguration 接管，此处仅做保底配置
    max-connections: 10000
    accept-count: 200

spring:
  application:
    name: holiday-api-j25
  # 虚拟线程：Spring Boot 4 原生支持
  threads:
    virtual:
      enabled: true
  cache:
    type: caffeine
  # Redis 二级缓存（可选，仅在需要多实例部署时启用）
  # 取消注释以下配置启用 Redis
  # data:
  #   redis:
  #     host: ${REDIS_HOST:localhost}
  #     port: ${REDIS_PORT:6379}
  #     password: ${REDIS_PASSWORD:}
  #     database: 0
  #     timeout: 3s
  #     lettuce:
  #       pool:
  #         max-active: 16
  #         max-idle: 8
  #         min-idle: 2
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,caches,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# === 审计日志 logback 配置说明 ===
# AUDIT logger 可通过 logback-spring.xml 导向独立文件：
#   <logger name="AUDIT" level="INFO" additivity="false">
#     <appender-ref ref="AUDIT_FILE"/>
#   </logger>

logging:
  level:
    AUDIT: INFO
    com.github.gmkits.holiday: INFO

holiday:
  api:
    api-version: 2.0.0
    default-region: CN
    data-path: ${HOLIDAY_DATA_PATH:}
    classpath-fallback: true
    manifest-location: ${HOLIDAY_MANIFEST_LOCATION:classpath:manifest.json}
    preload-current-and-next-year: true
    preload-regions:
      - CN
    preload-years: []
    cache:
      day-maximum-size: 4096
      year-maximum-size: 128
      metadata-maximum-size: 256
      expire-after-write: PT30M
    redis-cache:
      enabled: false
      key-prefix: "holiday:"
      ttl: PT2H
    rate-limit:
      enabled: true
      global-qps: 500
      per-ip-qps: 50
    audit:
      enabled: true
