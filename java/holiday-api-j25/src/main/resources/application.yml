server:
  port: 18080
  tomcat:
    # Spring Boot 原生虚拟线程负责请求处理；这里限制连接排队规模
    max-connections: 10000
    accept-count: 200

spring:
  application:
    name: holiday-api-j25
  # 虚拟线程：Spring Boot 4 原生支持
  threads:
    virtual:
      enabled: true
  cache:
    type: caffeine
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,caches,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# === 审计日志 logback 配置说明 ===
# AUDIT logger 可通过 logback-spring.xml 导向独立文件：
#   <logger name="AUDIT" level="INFO" additivity="false">
#     <appender-ref ref="AUDIT_FILE"/>
#   </logger>

logging:
  level:
    AUDIT: INFO
    com.github.gmkits.holiday: INFO

holiday:
  api:
    api-version: 2.0.0
    default-region: CN
    asset-path: ${HOLIDAY_ASSET_PATH:}
    data-path: ${HOLIDAY_DATA_PATH:}
    classpath-fallback: true
    manifest-location: ${HOLIDAY_MANIFEST_LOCATION:classpath:cn-holiday-kit/assets/holidays/manifest.json}
    preload-current-and-next-year: true
    preload-regions:
      - CN
    preload-years: []
    cache:
      day-maximum-size: 4096
      year-maximum-size: 128
      metadata-maximum-size: 256
      expire-after-write: PT30M
    rate-limit:
      enabled: ${HOLIDAY_RATE_LIMIT_ENABLED:true}
      global-qps: ${HOLIDAY_GLOBAL_QPS:500}
      per-ip-qps: ${HOLIDAY_PER_IP_QPS:50}
    audit:
      enabled: ${HOLIDAY_AUDIT_ENABLED:true}
