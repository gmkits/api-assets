services:
  holiday-api:
    build:
      context: .
      dockerfile: java/holiday-api-j8/Dockerfile
    ports:
      - "18080:8080"
    environment:
      HOLIDAY_ASSET_PATH: /assets
      JAVA_OPTS: -Xms256m -Xmx1g -XX:+UseG1GC
    volumes:
      - ./data/date-assets:/assets:ro
    restart: unless-stopped
