name: API assets CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      assets: ${{ steps.assets.outputs.assets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: assets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t all_assets < <(find apis -mindepth 2 -maxdepth 2 -name api-asset.json -print | cut -d/ -f2 | sort)
          selected=("${all_assets[@]}")

          if [[ "$EVENT_NAME" != workflow_dispatch ]]; then
            base="$BEFORE_SHA"
            [[ "$EVENT_NAME" == pull_request ]] && base="$PR_BASE_SHA"
            if [[ -n "$base" && "$base" != 0000000000000000000000000000000000000000 ]] \
                && git cat-file -e "$base^{commit}" 2>/dev/null; then
              mapfile -t changed < <(git diff --name-only "$base" "$GITHUB_SHA")
              selected=()
              verify_all=false
              for path in "${changed[@]}"; do
                case "$path" in
                  shared/*|tools/*|Makefile|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig.base.json|compose.yaml|.dockerignore|.github/workflows/ci.yml)
                    verify_all=true
                    ;;
                  apis/*/*)
                    asset="${path#apis/}"
                    asset="${asset%%/*}"
                    [[ -f "apis/$asset/api-asset.json" ]] && selected+=("$asset")
                    ;;
                esac
              done
              [[ "$verify_all" == true ]] && selected=("${all_assets[@]}")
            fi
          fi

          mapfile -t selected < <(printf '%s\n' "${selected[@]}" | awk 'NF && !seen[$0]++' | sort)
          assets=$(node -e 'console.log(JSON.stringify(process.argv.slice(1)))' "${selected[@]}")
          echo "assets=$assets" >> "$GITHUB_OUTPUT"

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate:assets
      - run: pnpm run lint:openapi

  verify:
    needs: [discover, contracts]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        asset: ${{ fromJSON(needs.discover.outputs.assets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: pnpm
      - uses: actions/setup-java@v4
        if: matrix.asset == 'calendar'
        with:
          distribution: liberica
          java-version: '21'
          cache: maven
      - run: pnpm install --frozen-lockfile
      - run: make -C "apis/${{ matrix.asset }}" verify
      - run: git diff --exit-code

  image:
    needs: [discover, verify]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        asset: ${{ fromJSON(needs.discover.outputs.assets) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build OCI image without publishing
        run: make image API="${{ matrix.asset }}"
