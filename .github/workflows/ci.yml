name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── JSON Schema 格式校验 ──
  spec-validate:
    name: 校验 JSON Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g ajv-cli ajv-formats
      - name: 校验所有 Schema 文件
        run: |
          for schema in spec/holiday-json-schema/*.schema.json; do
            echo "Validating $schema..."
            ajv compile -s "$schema" --spec=draft7 -c ajv-formats
          done

  # ── TypeScript 全量构建 + 类型检查 + 测试 + 编译器流水线 ──
  ts-build:
    name: TypeScript 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install
      - run: pnpm -r run build
      - run: pnpm -r run lint
      - run: pnpm -r run test
      - name: 验证编译器流水线
        run: |
          node packages/ts-compiler/dist/esm/cli.js validate --input data/canonical/CN/2025.canon.json
          node packages/ts-compiler/dist/esm/cli.js validate --input data/canonical/CN/2026.canon.json
          node packages/ts-compiler/dist/esm/cli.js inspect --bundle data/bundles/CN/2025.hday
          node packages/ts-compiler/dist/esm/cli.js inspect --bundle data/bundles/CN/2026.hday

  # ── Java 多版本矩阵构建 ──
  java-build:
    name: Java 构建与测试 (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - name: 构建 Java 8 兼容模块 (JDK 17)
        if: matrix.java == '17'
        working-directory: java
        run: mvn -B clean verify
      - name: 构建全部模块含 J25 API (JDK 25)
        if: matrix.java == '25'
        working-directory: java
        run: mvn -B clean verify -Pj25

  # ── Bundle 完整性校验（魔数 + SHA256）──
  bundle-verify:
    name: Bundle 完整性校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 校验 bundle 文件完整性
        run: bash scripts/verify-bundles.sh
